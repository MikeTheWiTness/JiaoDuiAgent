[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

addopts =
    -v
    --tb=short
    --strict-markers
    --ignore=tests/test_e2e_agent_pipeline.py
    --ignore=tests/test_e2e_shidianguji_integration.py
    --ignore=tests/test_shidianguji_playwright.py
    --ignore=tests/test_chinese_classics.py
    --ignore=tests/test_docx_format_enhancer.py

markers =
    slow: marks tests as slow (deselect with '-m "not slow"')
    network: marks tests that require network access
    e2e: marks end-to-end tests

filterwarnings =
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning
