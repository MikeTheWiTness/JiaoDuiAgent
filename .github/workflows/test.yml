name: Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install -i https://pypi.tuna.tsinghua.edu.cn/simple pytest pytest-cov
          pip install -i https://pypi.tuna.tsinghua.edu.cn/simple -r requirements.txt 2>/dev/null || true
          pip install -i https://pypi.tuna.tsinghua.edu.cn/simple pydantic requests langchain-core 2>/dev/null || true

      - name: Run tests
        run: |
          python -m pytest --tb=short -q \
            --ignore=tests/test_e2e_agent_pipeline.py \
            --ignore=tests/test_e2e_knowledge.py \
            --ignore=tests/test_e2e_shidianguji_integration.py \
            --ignore=tests/test_shidianguji_playwright.py \
            --ignore=tests/test_chinese_classics.py \
            --ignore=tests/test_docx_format_enhancer.py
