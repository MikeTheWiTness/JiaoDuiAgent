name: Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.12"]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install pandoc (ubuntu)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y pandoc

      - name: Install pandoc (windows)
        if: runner.os == 'Windows'
        run: choco install pandoc -y --no-progress

      - name: Install TeX Live (ubuntu, for PDF compile tests)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get install -y \
            texlive-xetex \
            texlive-lang-chinese \
            texlive-fonts-recommended \
            texlive-latex-recommended \
            texlive-latex-extra \
            texlive-pictures \
            texlive-science

      - name: Check lock is in sync with requirements.txt
        run: |
          python -c "import re; reqs={re.split(r'[<>=!~]', l.strip())[0].lower() for l in open('requirements.txt') if l.strip() and not l.startswith('#')}; locked={re.split(r'[<>=!~]', l.strip())[0].lower() for l in open('requirements.lock') if l.strip() and not l.startswith('#')}; missing=reqs-locked; raise SystemExit(f'requirements.lock 缺包: {sorted(missing)}') if missing else print('lock 同步 OK')"

      - name: Install dependencies
        run: |
          pip install -i https://pypi.tuna.tsinghua.edu.cn/simple pytest pytest-cov
          pip install -i https://pypi.tuna.tsinghua.edu.cn/simple -r requirements.lock

      - name: Lint with ruff
        run: |
          pip install -i https://pypi.tuna.tsinghua.edu.cn/simple ruff
          ruff check .

      - name: Run tests
        run: |
          python -m pytest --tb=short -q -m "not e2e and not network and not slow"
